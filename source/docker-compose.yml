services:
  processing_service:
    build:
      context: ./processing_service
      dockerfile: Dockerfile
    deploy:
      replicas: 5
    ports:
      - "8086-8090:8000"
    depends_on:
      - broker
    env_file:
      - ./processing_service/.env
    environment:
      - BROKER_WEBSOCKET_URI=ws://broker:8000/ws/stream
      - SHUTDOWN_SSE_URI=http://simulator:8080/api/control
    networks:
      - backend_network

  broker:
    build: ./custom_broker
    environment:
      - PYTHONUNBUFFERED=1
    ports:
      - "9000:8000"
    depends_on:
      - simulator
    networks:
      - backend_network

  simulator:
    image: seismic-signal-simulator:multiarch_v1
    ports:
      - "8080:8080"
    networks:
      - backend_network

  frontend:
    build:
      context: ./frontend
    ports:
      - "80:80"
    networks:
      - backend_network
    depends_on:
      - broker
      - processing_service

networks:
  backend_network:
    driver: bridge