services:
  processing_service_replica_1:
    build:
      context: /processing_service
      dockerfile: Dockerfile
    container_name: processing_service
    ports:
      - "8086:8000"
    depends_on:
      - broker
    env_file:
      - /processing_service/.env
    environment:
      - BROKER_WEBSOCKET_URI=ws://broker:8000/ws/stream
      - SHUTDOWN_SSE_URI=http://simulator:8080/api/control
    networks:
      - backend_network

  broker:
    build: ./custom_broker
    environment:
      - PYTHONUNBUFFERED=1
    ports:
      - "9000:8000"
    depends_on:
      - simulator
    networks:
      - backend_network

  simulator:
    image: seismic-signal-simulator:multiarch_v1
    ports:
      - "8080:8080"
    networks:
      - backend_network

  postgres_db:
    # INVECE di 'image:', usiamo 'build:' puntando alla nostra nuova cartella
    build: ./database
    container_name: seismic_db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: supersecret
      POSTGRES_DB: seismic_data
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:

networks:
  backend_network:
    driver: bridge