services:
  processing_service:
    build:
      context: ./processing_service
      dockerfile: Dockerfile
    deploy:
      replicas: 10
    depends_on:
      - broker
      - postgres_db
    env_file:
      - ./processing_service/.env
    environment:
      - BROKER_WEBSOCKET_URI=ws://broker:8000/ws/stream
      - SHUTDOWN_SSE_URI=http://simulator:8080/api/control
    networks:
      - backend_network

  broker:
    build: ./custom_broker
    environment:
      - PYTHONUNBUFFERED=1
    ports:
      - "9000:8000"
    depends_on:
      - simulator
    networks:
      - backend_network

  simulator:
    image: seismic-signal-simulator:multiarch_v1
    ports:
      - "8080:8080"
    networks:
      - backend_network

  postgres_db:
    build: ./database
    container_name: event_db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: supersecret
      POSTGRES_DB: event_data
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend_network

  gateway:
    build:
      context: ./gateway
    ports:
      - "80:80"
    depends_on:
      - frontend
      - processing_service
    networks:
      - backend_network

  frontend:
    build:
      context: ./frontend
    networks:
      - backend_network
    depends_on:
      - broker
      - processing_service

volumes:
  postgres_data:

networks:
  backend_network:
    driver: bridge