services:
  processing_service:
    build:
      context: ./processing_service
      dockerfile: Dockerfile
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--log-level", "warning"]
    deploy:
      replicas: 10
    depends_on:
      broker:
        condition: service_started
      postgres_db:
        condition: service_healthy
    env_file:
      - ./processing_service/.env
    environment:
      - BROKER_WEBSOCKET_URI=ws://broker:8000/ws/stream
      - SHUTDOWN_SSE_URI=http://simulator:8080/api/control
    networks:
      - backend_network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://processing_service:8000/health')"]
      interval: 24h
      timeout: 5s
      retries: 5
      start_period: 60s
      start_interval: 5s

  broker:
    build: ./custom_broker
    command: ["uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "8000", "--log-level", "warning"]
    environment:
      - PYTHONUNBUFFERED=1
    ports:
      - "9000:8000"
    depends_on:
      - simulator
    networks:
      - backend_network

  simulator:
    image: seismic-signal-simulator:multiarch_v1
    ports:
      - "8080:8080"
    networks:
      - backend_network

  postgres_db:
    build: ./database
    container_name: event_db
    command: ["postgres", "-c", "log_min_messages=PANIC"]
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d event_data"]
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: supersecret
      POSTGRES_DB: event_data
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend_network

  gateway:
    build:
      context: ./gateway
    ports:
      - "80:80"
    depends_on:
      - frontend
    networks:
      - backend_network

  frontend:
    build:
      context: ./frontend
    networks:
      - backend_network
    depends_on:
      processing_service:
        condition: service_healthy

volumes:
  postgres_data:

networks:
  backend_network:
    driver: bridge