upstream backend_replicas {
    # Nginx passive health check: max_fails=3, fail_timeout=10s
    server processing_service_replica_1:8000 max_fails=3 fail_timeout=10s;
    server processing_service_replica_2:8000 max_fails=3 fail_timeout=10s;
    server processing_service_replica_3:8000 max_fails=3 fail_timeout=10s;
    server processing_service_replica_4:8000 max_fails=3 fail_timeout=10s;
    server processing_service_replica_5:8000 max_fails=3 fail_timeout=10s;
}

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    location / {
        # SPA Fallback
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to the upstream processing replicas
    location /api/ {
        proxy_pass http://backend_replicas;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Cache static assets
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public";
    }
}
