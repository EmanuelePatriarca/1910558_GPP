upstream backend_replicas {
    # Single processing_service container (container_name in docker-compose)
    # Extend to replica-2..5 here once additional replicas are defined
    server processing_service:8000 max_fails=3 fail_timeout=10s;
}

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    location / {
        # SPA Fallback
        try_files $uri $uri/ /index.html;
    }

    # WebSocket endpoint for live seismic events - dedicated block for WS upgrade
    location /api/v1/events/ws {
        proxy_pass http://backend_replicas/ws/events_stream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;  # Keep WS connection alive up to 1 hour
        proxy_send_timeout 3600s;
    }

    # REST API requests to the upstream processing replicas
    location /api/ {
        proxy_pass http://backend_replicas;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
    }

    # Cache static assets
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public";
    }
}
