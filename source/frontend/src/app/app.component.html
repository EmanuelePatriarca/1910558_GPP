<!-- Shell Wrapper: Dark mode fissa, sfondo slate -->
<div class="h-screen bg-slate-950 text-slate-300 font-sans flex flex-col overflow-hidden">

  <!-- Top Header -->
  <header class="h-16 flex items-center justify-between px-6 border-b border-slate-800 shrink-0 bg-slate-900 shadow-sm relative z-20">
    <div class="flex-1"></div>
    <h1 class="text-xl font-bold tracking-wide text-slate-100 uppercase">
      Surveillance Dashboard
    </h1>
    <div class="flex-1 flex justify-end items-center gap-4">
      <button class="relative rounded-full p-2 hover:bg-slate-800 transition-colors text-slate-400 hover:text-white" title="Notifications">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
        </svg>
        <span class="absolute top-1 right-2 block h-2 w-2 rounded-full bg-red-500 ring-2 ring-slate-900 animate-pulse"></span>
      </button>
    </div>
  </header>

  <!-- Main Content Area -->
  <main class="flex-1 overflow-hidden p-4 lg:p-6 relative flex flex-col">
    <div class="absolute inset-x-0 top-0 h-40 bg-gradient-to-b from-slate-900/50 to-transparent pointer-events-none z-0"></div>
    
    <div class="relative z-10 flex-1 min-h-0 max-w-[1920px] mx-auto w-full flex flex-col">
       <router-outlet></router-outlet>
    </div>
  </main>
</div>
