map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream backend_replicas {
    # Escludiamo le repliche fallite per un anno (31536000s) poiché, in questa architettura, 
    # una replica che va giù non viene riavviata. Questo evita tentativi inutili su nodi morti.
    server processing_service:8000 max_fails=1 fail_timeout=31536000s;
}

upstream frontend_app {
    server frontend:80;
}

server {
    listen 80;
    server_name localhost;

    # Risoluzione DNS dinamica con validità di 2 secondi per scoprire rapidamente nuove repliche/cambi IP
    resolver 127.0.0.11 valid=2s;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Gestione WebSocket: proxy verso il processing_service con failover L7
    location /api/v1/events/ws {
        proxy_pass http://backend_replicas/ws/events_stream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # Failover trasparente: timeout di connessione ridotto a 500ms
        proxy_connect_timeout 500ms;
        proxy_next_upstream error timeout http_502 http_504;
        proxy_next_upstream_timeout 2s; 
        proxy_next_upstream_tries 0; 
        
        proxy_read_timeout 360s;
        proxy_send_timeout 360s;
    }

    # REST API requests - proxy to processing_service
    location /api/ {
        proxy_pass http://backend_replicas;
        proxy_http_version 1.1;
        proxy_connect_timeout 500ms;
        proxy_next_upstream error timeout http_502 http_504;
        proxy_next_upstream_timeout 2s;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_cache_bypass $http_upgrade;
    }

    # All other requests - proxy to frontend_app
    location / {
        proxy_pass http://frontend_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_cache_bypass $http_upgrade;
    }
}
