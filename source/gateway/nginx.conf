# REST API Gateway - Gestione generica e Streaming SSE
# Il buffering è disabilitato per permettere lo streaming real-time (SSE)

upstream backend_replicas {
    # Escludiamo le repliche fallite per un anno (31536000s) poiché, in questa architettura, 
    # una replica che va giù non viene riavviata. Questo evita tentativi inutili su nodi morti.
    server processing_service:8000 max_fails=1 fail_timeout=31536000s;
}

upstream frontend_app {
    server frontend:80;
}

server {
    listen 80;
    server_name localhost;

    access_log off;
    error_log /dev/null crit;

    # Risoluzione DNS dinamica con validità di 2 secondi per scoprire rapidamente nuove repliche/cambi IP
    resolver 127.0.0.11 valid=2s;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # REST API Gateway - Gestione generica e Streaming SSE
    # Il buffering è disabilitato per permettere lo streaming real-time (SSE)
    location /api/v1/ {
        proxy_pass http://backend_replicas/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # Ottimizzazioni per Server-Sent Events (SSE)
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 360s;
        
        # Configurazione alta disponibilità (Failover)
        proxy_connect_timeout 500ms;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_timeout 10s;
        proxy_next_upstream_tries 0;
    }

    # All other requests - proxy to frontend_app
    location / {
        proxy_pass http://frontend_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
